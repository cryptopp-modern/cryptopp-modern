name: Branch Build and Test

on:
  workflow_dispatch:

jobs:
  # =============================================================================
  # CMake Builds
  # =============================================================================

  cmake-linux:
    name: CMake Linux (GCC)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Configure
      run: cmake --preset=ci-linux -DCRYPTOPP_WERROR=ON

    - name: Build
      run: cmake --build build/ci-linux -j"$(nproc)"

    - name: Run validation tests
      run: ./build/ci-linux/cryptest.exe v

    - name: Run test vectors
      run: ./build/ci-linux/cryptest.exe tv all

    - name: Check feature probes under -Werror (configure only)
      run: |
        # A -Werror in the incoming flags, plain, configuration-specific or
        # oddly delimited, and quoted paths must not change the detected
        # features, and the probe-only -w must not reach the library build.
        mkdir -p "$RUNNER_TEMP/probe include" "$RUNNER_TEMP/probe -Werror include"
        : > "$RUNNER_TEMP/probe -Werror include/header.h"
        check() {
          dir=$1; shift
          cmake -S . -B "build/$dir" -DCRYPTOPP_BUILD_TESTING=OFF "$@" > /dev/null
          for feature in SSE2 SSE41 AVX512; do
            grep -q "^CRYPTOPP_HAVE_$feature:INTERNAL=1$" "build/$dir/CMakeCache.txt" \
              || { echo "ERROR: $dir: $feature not detected"; exit 1; }
          done
          ninja -C "build/$dir" -t commands cryptopp > "build/$dir/commands.txt"
          grep -q -- '-Werror' "build/$dir/commands.txt" \
            || { echo "ERROR: $dir: -Werror missing from the build"; exit 1; }
          if grep -q -- ' -w ' "build/$dir/commands.txt"; then
            echo "ERROR: $dir: probe-only -w reached the build"; exit 1
          fi
        }
        check probe-werror -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_FLAGS="-Wall -Werror"
        check probe-config-werror -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_FLAGS=-Wall -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -Werror" \
          -DCMAKE_TRY_COMPILE_CONFIGURATION=Release
        check probe-multi-config -G "Ninja Multi-Config" \
          -DCMAKE_CXX_FLAGS=-Wall -DCMAKE_CXX_FLAGS_DEBUG="-g -Werror"
        check probe-quoted -G Ninja -DCMAKE_BUILD_TYPE=Release \
          "-DCMAKE_CXX_FLAGS=-I\"$RUNNER_TEMP/probe include\" -Wall -Werror"
        check probe-include -G Ninja -DCMAKE_BUILD_TYPE=Release \
          "-DCMAKE_CXX_FLAGS=-include \"$RUNNER_TEMP/probe -Werror include/header.h\" -Wall -Werror"
        check probe-tab -G Ninja -DCMAKE_BUILD_TYPE=Release \
          "-DCMAKE_CXX_FLAGS=$(printf -- '-Wall\t-Werror')"
        echo "feature probes OK"

    - name: Check the AVX-512 probe fallback
      run: |
        # A compiler that fails the AVX-512 probe must get a clean fallback,
        # not AVX-512 intrinsics compiled without -mavx512f. Seeding the
        # cache entry skips the probe and records it as failed.
        cmake -S . -B build/probe-no-avx512 -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCRYPTOPP_BUILD_TESTING=OFF -DCRYPTOPP_HAVE_AVX512=0 > /dev/null
        ninja -C build/probe-no-avx512 -t commands cryptopp \
          | grep -q -- '-DCRYPTOPP_DISABLE_AVX512=1' \
          || { echo "ERROR: CRYPTOPP_DISABLE_AVX512 not defined after a failed probe"; exit 1; }
        ninja -C build/probe-no-avx512 \
          CMakeFiles/cryptopp.dir/src/hash/blake3.cpp.o \
          CMakeFiles/cryptopp.dir/src/hash/blake3_avx512.cpp.o
        echo "AVX-512 fallback OK"

  cmake-linux-gcc14:
    name: CMake Linux (GCC 14)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    - name: Install GCC 14 and Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-14 g++-14 ninja-build

    - name: Configure (GCC 14)
      env:
        CC: gcc-14
        CXX: g++-14
      run: cmake --preset=ci-linux

    - name: Build
      run: cmake --build build/ci-linux -j"$(nproc)"

    - name: Run validation tests
      run: ./build/ci-linux/cryptest.exe v

    - name: Run test vectors
      run: ./build/ci-linux/cryptest.exe tv all

  cmake-linux-clang19:
    name: CMake Linux (Clang 19)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    - name: Install Clang 19 and Ninja
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-19 ninja-build

    - name: Check CPU features
      run: |
        echo "=== CPU Information ==="
        lscpu | grep -E "Model name|Flags"
        echo ""
        echo "=== AVX512 Flags ==="
        if grep -q avx512f /proc/cpuinfo; then
          echo "AVX512F: SUPPORTED"
        else
          echo "AVX512F: NOT SUPPORTED"
        fi

    - name: Configure (Clang 19)
      env:
        CC: clang-19
        CXX: clang++-19
      run: cmake --preset=ci-linux

    - name: Build
      run: cmake --build build/ci-linux -j"$(nproc)"

    - name: Run validation tests
      run: ./build/ci-linux/cryptest.exe v

    - name: Run test vectors
      run: ./build/ci-linux/cryptest.exe tv all

  cmake-macos:
    name: CMake macOS (Clang)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Ninja
      run: brew install ninja

    - name: Configure
      run: cmake --preset=ci-macos

    - name: Build
      run: cmake --build build/ci-macos -j"$(sysctl -n hw.ncpu)"

    - name: Run validation tests
      run: |
        set -o pipefail
        ./build/ci-macos/cryptest.exe v | tee cryptest-v.log

    - name: Check Apple arm64 hardware feature detection
      if: runner.arch == 'ARM64'
      run: |
        FEATURES=$(grep -o 'hasASIMD == .*' cryptest-v.log | head -1)
        echo "$FEATURES"
        # Every 64-bit Apple core implements these.
        for f in hasASIMD hasAES hasPMULL hasSHA1 hasSHA2; do
          echo "$FEATURES" | grep -q "$f == 1" || { echo "ERROR: $f not detected"; exit 1; }
        done
        # The optional extensions must agree with the OS. The first key that
        # exists wins; the second names are the pre-macOS 12 spellings.
        check() {
          flag=$1; shift
          expected=0
          for key in "$@"; do
            if value=$(sysctl -n "$key" 2>/dev/null); then expected=$value; break; fi
          done
          echo "$FEATURES" | grep -q "$flag == $expected" || { echo "ERROR: $flag disagrees with the kernel ($expected)"; exit 1; }
        }
        check hasCRC32 hw.optional.armv8_crc32
        check hasSHA3 hw.optional.arm.FEAT_SHA3 hw.optional.armv8_2_sha3
        check hasSHA512 hw.optional.arm.FEAT_SHA512 hw.optional.armv8_2_sha512

    - name: Run test vectors
      run: ./build/ci-macos/cryptest.exe tv all

  cmake-windows:
    name: CMake Windows (MSVC)
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v5

    - name: Configure
      run: cmake --preset=ci-windows

    - name: Build
      run: cmake --build build/ci-windows --config Release

    - name: Run the test suite through CTest
      run: ctest --test-dir build/ci-windows -C Release -V --no-tests=error

  cmake-windows-arm64:
    # ARM64 Windows host with the Visual Studio generator, covering issue #43:
    # MASM (ml64) A1000 when the generator writes ASM objects under a source
    # subdir. Builds for x64 (MASM active) and ARM64 (ASM disabled). Runners
    # ship Visual Studio 2022; the reporter hit it on 2026, so a pass here
    # covers the ARM64 host path but not the 2026-specific toolset.
    name: CMake Windows ARM64 host (MSVC, ${{ matrix.target }})
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        target: [x64, ARM64]

    steps:
    - uses: actions/checkout@v5

    - name: Configure (Visual Studio generator, ${{ matrix.target }} target)
      run: cmake -S . -B build/ci-win-arm -G "Visual Studio 17 2022" -A ${{ matrix.target }} -DCMAKE_BUILD_TYPE=Release -DCRYPTOPP_BUILD_TESTING=ON

    - name: Build
      run: cmake --build build/ci-win-arm --config Release

  cmake-no-asm:
    name: CMake No-ASM (Pure C++)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Configure (No ASM)
      run: cmake --preset=no-asm

    - name: Build
      run: cmake --build build/no-asm -j"$(nproc)"

    - name: Run validation tests
      run: ./build/no-asm/cryptest.exe v

    - name: Run test vectors
      run: ./build/no-asm/cryptest.exe tv all

  cmake-install:
    name: CMake Install Test
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Configure
      run: cmake --preset=install-test

    - name: Build
      run: cmake --build build/install-test -j"$(nproc)"

    - name: Install
      run: cmake --install build/install-test

    - name: Verify installation
      run: |
        test -f build/install/lib/libcryptopp.a
        test -d build/install/include/cryptopp
        test -f build/install/include/cryptopp/aes.h
        test -f build/install/lib/cmake/cryptopp-modern/cryptopp-modernConfig.cmake
        # The default install ships cryptest and its data.
        test -f build/install/bin/cryptest.exe
        test -d build/install/share/cryptopp/TestData
        test -d build/install/share/cryptopp/TestVectors
        # Both pkg-config names must resolve and yield usable flags; the
        # cryptopp-modern alias forwards to libcryptopp through Requires.
        export PKG_CONFIG_PATH="$PWD/build/install/lib/pkgconfig"
        pkg-config --exists libcryptopp
        pkg-config --exists cryptopp-modern
        pkg-config --cflags --libs libcryptopp
        pkg-config --cflags --libs cryptopp-modern
        test "$(pkg-config --libs cryptopp-modern)" = "$(pkg-config --libs libcryptopp)"
        # A mismatched libcryptopp.pc earlier in the path must not satisfy the
        # version-pinned alias; the lookup should fail rather than resolve to it.
        mkdir -p "$RUNNER_TEMP/fakepc"
        printf 'Name: libcryptopp\nDescription: mismatched\nVersion: 0.0.0\nCflags: -I/nonexistent\n' > "$RUNNER_TEMP/fakepc/libcryptopp.pc"
        if PKG_CONFIG_PATH="$RUNNER_TEMP/fakepc:$PWD/build/install/lib/pkgconfig" pkg-config --exists cryptopp-modern; then
          echo "ERROR: alias resolved through a mismatched libcryptopp.pc" >&2
          exit 1
        fi
        ls -la build/install/include/cryptopp/ | head -20

    - name: Verify install without cryptest
      run: |
        # Keep cryptest available for CTest but omit it from this install.
        cmake build/install-test -DCRYPTOPP_INSTALL_CRYPTEST=OFF
        cmake --install build/install-test --prefix build/install-notest
        test -f build/install-notest/lib/libcryptopp.a
        test ! -e build/install-notest/bin/cryptest.exe
        test ! -e build/install-notest/share/cryptopp/TestData
        test ! -e build/install-notest/share/cryptopp/TestVectors

    - name: Verify cryptest-only install
      run: |
        # Install cryptest as a tool with CRYPTOPP_BUILD_TESTING disabled.
        cmake build/install-test -DCRYPTOPP_BUILD_TESTING=OFF -DCRYPTOPP_INSTALL_CRYPTEST=ON
        cmake --build build/install-test --target cryptest -j"$(nproc)"
        cmake --install build/install-test --prefix build/install-tools
        test -f build/install-tools/bin/cryptest.exe
        test -d build/install-tools/share/cryptopp/TestData
        test -d build/install-tools/share/cryptopp/TestVectors
        cd "$RUNNER_TEMP"
        "$GITHUB_WORKSPACE/build/install-tools/bin/cryptest.exe" v

    - name: Test find_package integration
      run: |
        mkdir -p test-project && cd test-project
        cat > CMakeLists.txt << 'EOF'
        cmake_minimum_required(VERSION 3.20)
        project(test-cryptopp)
        find_package(cryptopp-modern REQUIRED)
        add_executable(test-app main.cpp)
        target_link_libraries(test-app PRIVATE cryptopp::cryptopp)
        EOF
        cat > main.cpp << 'EOF'
        #include <cryptopp/sha.h>
        #include <cryptopp/hex.h>
        #include <cryptopp/filters.h>
        #include <iostream>
        int main() {
            CryptoPP::SHA256 hash;
            std::string digest;
            CryptoPP::StringSource ss("test", true,
                new CryptoPP::HashFilter(hash,
                    new CryptoPP::HexEncoder(
                        new CryptoPP::StringSink(digest))));
            std::cout << "SHA256: " << digest << std::endl;
            return 0;
        }
        EOF
        cmake -B build -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install
        cmake --build build
        ./build/test-app

  cmake-shared:
    name: CMake Shared Library Test
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Configure (shared, tests on)
      run: >
        cmake -S . -B build/shared -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCRYPTOPP_BUILD_SHARED=ON
        -DCRYPTOPP_BUILD_TESTING=ON
        -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/shared-install

    - name: Build
      run: cmake --build build/shared -j"$(nproc)"

    - name: Validate against the shared library
      run: |
        # cryptest links the .so, so a passing run proves the API is exported,
        # and cryptest itself must record a NEEDED entry for the ABI SONAME.
        cd build/shared
        LD_LIBRARY_PATH="$PWD" ./cryptest.exe v
        readelf -d ./cryptest.exe | grep -qE 'NEEDED.*libcryptopp\.so\.[0-9]+\]' \
          || { echo "ERROR: cryptest is not linked against the shared library"; exit 1; }

    - name: Install
      run: cmake --install build/shared

    - name: Verify SONAME, symlink chain and downstream consumers
      run: |
        INST="${{ github.workspace }}/build/shared-install"
        ABI=$(grep -oE 'define[ ]+CRYPTOPP_ABI_VERSION[ ]+[0-9]+' include/cryptopp/config_ver.h | grep -oE '[0-9]+$')
        REAL=$(find "$INST" -name 'libcryptopp.so.*' -type f | head -1)
        LIBDIR=$(dirname "$REAL")
        PCDIR=$(dirname "$(find "$INST" -name libcryptopp.pc | head -1)")
        SONAME=$(readelf -d "$REAL" | grep -oE 'libcryptopp\.so\.[0-9.]+' | head -1)
        echo "SONAME=$SONAME  file=$(basename "$REAL")  ABI=$ABI"
        # SONAME must be exactly the ABI version, not the release version.
        test "$SONAME" = "libcryptopp.so.$ABI" \
          || { echo "ERROR: SONAME $SONAME != libcryptopp.so.$ABI"; exit 1; }
        # Symlink chain: libcryptopp.so -> libcryptopp.so.$ABI -> real file.
        test "$(readlink "$LIBDIR/libcryptopp.so")" = "$SONAME"
        test "$(readlink "$LIBDIR/$SONAME")" = "$(basename "$REAL")"
        # The consumer calls an out-of-line longstanding symbol (SHA256) and an
        # out-of-line fork-added symbol (BLAKE3); a header-only call would not
        # prove the symbols are exported. Built at the project C++11 baseline.
        cat > consumer.cpp << 'EOF'
        #include <cryptopp/sha.h>
        #include <cryptopp/blake3.h>
        #include <cryptopp/cryptlib.h>
        #include <vector>
        using namespace CryptoPP;
        int main() {
            const byte msg[3] = {'a','b','c'};
            SHA256 sha; std::vector<byte> d1(sha.DigestSize());
            sha.CalculateDigest(d1.data(), msg, 3);
            BLAKE3 b3; std::vector<byte> d2(b3.DigestSize());
            b3.CalculateDigest(d2.data(), msg, 3);
            return (d1[0] == 0xba && d2[0] == 0x64) ? 0 : 1;  // digests of "abc"
        }
        EOF
        # Consumer A: pkg-config libcryptopp
        g++ -std=c++11 consumer.cpp \
          $(PKG_CONFIG_PATH="$PCDIR" pkg-config --cflags --libs libcryptopp) -o consumer_pc
        readelf -d consumer_pc | grep -qE "NEEDED.*$SONAME" \
          || { echo "ERROR: pkg-config consumer is not linked against $SONAME"; exit 1; }
        LD_LIBRARY_PATH="$LIBDIR" ./consumer_pc
        # Consumer B: find_package(cryptopp-modern)
        mkdir -p fp && cp consumer.cpp fp/ && cd fp
        cat > CMakeLists.txt << 'EOF'
        cmake_minimum_required(VERSION 3.20)
        project(consumer CXX)
        set(CMAKE_CXX_STANDARD 11)
        set(CMAKE_CXX_STANDARD_REQUIRED ON)
        set(CMAKE_CXX_EXTENSIONS OFF)
        find_package(cryptopp-modern REQUIRED)
        add_executable(consumer_fp consumer.cpp)
        target_link_libraries(consumer_fp PRIVATE cryptopp::cryptopp)
        EOF
        cmake -S . -B b -DCMAKE_PREFIX_PATH="$INST" > /dev/null
        cmake --build b > /dev/null
        readelf -d b/consumer_fp | grep -qE "NEEDED.*$SONAME" \
          || { echo "ERROR: find_package consumer is not linked against $SONAME"; exit 1; }
        LD_LIBRARY_PATH="$LIBDIR" ./b/consumer_fp
        echo "shared library consumers OK ($SONAME)"

    - name: GNUmakefile shared build SONAME parity
      run: |
        # The GNUmakefile is the other build system; its SONAME must match the
        # CMake one, since both derive from CRYPTOPP_ABI_VERSION.
        ABI=$(grep -oE 'define[ ]+CRYPTOPP_ABI_VERSION[ ]+[0-9]+' include/cryptopp/config_ver.h | grep -oE '[0-9]+$')
        make -j"$(nproc)" shared
        MK_REAL=$(find . -maxdepth 1 -name 'libcryptopp.so.*' -type f | head -1)
        MK_SONAME=$(readelf -d "$MK_REAL" | grep -oE 'libcryptopp\.so\.[0-9.]+' | head -1)
        echo "GNUmakefile SONAME=$MK_SONAME (file $(basename "$MK_REAL"))  ABI=$ABI"
        test "$MK_SONAME" = "libcryptopp.so.$ABI" \
          || { echo "ERROR: GNUmakefile SONAME $MK_SONAME != libcryptopp.so.$ABI"; exit 1; }

  cmake-dual:
    name: CMake Dual Shared and Static Test
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Configure (shared and static in one pass)
      run: >
        cmake -S . -B build/dual -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCRYPTOPP_BUILD_SHARED=ON
        -DCRYPTOPP_BUILD_STATIC=ON
        -DCRYPTOPP_BUILD_TESTING=ON
        -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/dual-install

    - name: Build
      run: cmake --build build/dual -j"$(nproc)"

    - name: Validate against the shared primary
      run: |
        cd build/dual
        LD_LIBRARY_PATH="$PWD" ./cryptest.exe v

    - name: Install and verify both libraries and export files
      run: |
        INST="${{ github.workspace }}/build/dual-install"
        cmake --install build/dual
        find "$INST" -name 'libcryptopp.a' | grep -q . \
          || { echo "ERROR: static archive not installed"; exit 1; }
        find "$INST" -name 'libcryptopp.so.*' -type f | grep -q . \
          || { echo "ERROR: shared library not installed"; exit 1; }
        CMAKEDIR=$(dirname "$(find "$INST" -name cryptopp-modernConfig.cmake | head -1)")
        test -f "$CMAKEDIR/cryptopp-modern-shared-targets.cmake" \
          || { echo "ERROR: shared export file not installed"; exit 1; }
        test -f "$CMAKEDIR/cryptopp-modern-static-targets.cmake" \
          || { echo "ERROR: static export file not installed"; exit 1; }

    - name: Build and run one consumer per component
      run: |
        INST="${{ github.workspace }}/build/dual-install"
        LIBDIR=$(dirname "$(find "$INST" -name 'libcryptopp.so.*' -type f | head -1)")
        mkdir -p dualc && cd dualc
        cat > consumer.cpp << 'EOF'
        #include <cryptopp/sha.h>
        #include <cryptopp/cryptlib.h>
        #include <vector>
        using namespace CryptoPP;
        int main() {
            const byte msg[3] = {'a','b','c'};
            SHA256 sha; std::vector<byte> d(sha.DigestSize());
            sha.CalculateDigest(d.data(), msg, 3);
            return d[0] == 0xba ? 0 : 1;  // digest of "abc"
        }
        EOF
        cat > CMakeLists.txt << 'EOF'
        cmake_minimum_required(VERSION 3.20)
        project(consumer CXX)
        set(CMAKE_CXX_STANDARD 11)
        set(CMAKE_CXX_STANDARD_REQUIRED ON)
        find_package(cryptopp-modern REQUIRED COMPONENTS ${CRYPTOPP_COMPONENT})
        add_executable(consumer consumer.cpp)
        target_link_libraries(consumer PRIVATE cryptopp::cryptopp)
        EOF
        # The static consumer must not record a NEEDED entry for the library;
        # the shared consumer must.
        cmake -S . -B c-static -DCMAKE_PREFIX_PATH="$INST" -DCRYPTOPP_COMPONENT=static > /dev/null
        cmake --build c-static > /dev/null
        if readelf -d c-static/consumer | grep -qE 'NEEDED.*libcryptopp'; then
          echo "ERROR: static-component consumer linked the shared library"; exit 1
        fi
        ./c-static/consumer
        cmake -S . -B c-shared -DCMAKE_PREFIX_PATH="$INST" -DCRYPTOPP_COMPONENT=shared > /dev/null
        cmake --build c-shared > /dev/null
        readelf -d c-shared/consumer | grep -qE 'NEEDED.*libcryptopp' \
          || { echo "ERROR: shared-component consumer is not linked against the shared library"; exit 1; }
        LD_LIBRARY_PATH="$LIBDIR" ./c-shared/consumer
        echo "dual install consumers OK"

    - name: Install with split prefixes and run one consumer per component
      run: |
        # Libraries under prefix A, headers under prefix B, so A/include does not
        # exist. The exported include directory must follow CMAKE_INSTALL_INCLUDEDIR.
        # The prefixes sit outside the checkout: CMake rejects an exported include
        # directory that lies inside the source tree.
        A="$RUNNER_TEMP/split-a"
        B="$RUNNER_TEMP/split-b"
        cmake -S . -B build/dual-split -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCRYPTOPP_BUILD_SHARED=ON \
          -DCRYPTOPP_BUILD_STATIC=ON \
          -DCRYPTOPP_BUILD_TESTING=OFF \
          -DCMAKE_INSTALL_PREFIX="$A" \
          -DCMAKE_INSTALL_LIBDIR="$A/lib" \
          -DCMAKE_INSTALL_INCLUDEDIR="$B/include" > /dev/null
        cmake --build build/dual-split -j"$(nproc)" > /dev/null
        cmake --install build/dual-split > /dev/null
        test ! -e "$A/include" || { echo "ERROR: headers installed under the library prefix"; exit 1; }
        test -f "$B/include/cryptopp/cryptlib.h" || { echo "ERROR: headers not installed under the include prefix"; exit 1; }
        cd dualc
        for comp in static shared; do
          cmake -S . -B "s-$comp" -DCMAKE_PREFIX_PATH="$A;$B" -DCRYPTOPP_COMPONENT=$comp > /dev/null
          cmake --build "s-$comp" > /dev/null
          LD_LIBRARY_PATH="$A/lib" "./s-$comp/consumer"
        done
        echo "split-prefix consumers OK"

  cmake-build-shared-libs:
    name: CMake BUILD_SHARED_LIBS Test
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Configure (BUILD_SHARED_LIBS only, tests on)
      run: >
        cmake -S . -B build/bsl -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_SHARED_LIBS=ON
        -DCRYPTOPP_BUILD_TESTING=ON
        -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/bsl-install

    - name: Build
      run: cmake --build build/bsl -j"$(nproc)"

    - name: Validate against the shared library
      run: |
        cd build/bsl
        LD_LIBRARY_PATH="$PWD" ./cryptest.exe v

    - name: Install and verify the library type
      run: |
        # The standard variable alone must select the shared library. The
        # SONAME, symlink and consumer checks live in the cmake-shared lane.
        INST="${{ github.workspace }}/build/bsl-install"
        cmake --install build/bsl
        find "$INST" -name 'libcryptopp.so.*' -type f | grep -q . \
          || { echo "ERROR: shared library not installed"; exit 1; }
        if find "$INST" -name 'libcryptopp.a' | grep -q .; then
          echo "ERROR: static archive installed with BUILD_SHARED_LIBS=ON"; exit 1
        fi

    - name: Check precedence (configure only)
      run: |
        # An explicit CRYPTOPP_BUILD_SHARED wins over BUILD_SHARED_LIBS, and a
        # defined-but-OFF BUILD_SHARED_LIBS keeps the static default.
        cmake -S . -B build/prec-off -G Ninja -DCRYPTOPP_BUILD_TESTING=OFF           -DBUILD_SHARED_LIBS=ON -DCRYPTOPP_BUILD_SHARED=OFF > /dev/null
        grep -q '^CRYPTOPP_BUILD_SHARED:BOOL=OFF$' build/prec-off/CMakeCache.txt           || { echo "ERROR: explicit CRYPTOPP_BUILD_SHARED=OFF did not win"; exit 1; }
        cmake -S . -B build/prec-bsl-off -G Ninja -DCRYPTOPP_BUILD_TESTING=OFF           -DBUILD_SHARED_LIBS=OFF > /dev/null
        grep -q '^CRYPTOPP_BUILD_SHARED:BOOL=OFF$' build/prec-bsl-off/CMakeCache.txt           || { echo "ERROR: BUILD_SHARED_LIBS=OFF did not keep the static default"; exit 1; }
        echo "precedence OK"

  makefile-macos-dylib:
    name: Makefile macOS dylib
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v5

    - name: make dylib and check versions
      run: |
        # compatibility_version must be the ABI version; current_version keeps
        # the release version. macOS pads a bare version to X.Y.Z.
        ABI=$(grep -oE 'define[ ]+CRYPTOPP_ABI_VERSION[ ]+[0-9]+' include/cryptopp/config_ver.h | grep -oE '[0-9]+$')
        make -j"$(sysctl -n hw.ncpu)" dylib
        otool -l libcryptopp.dylib | grep -A5 LC_ID_DYLIB
        COMPAT=$(otool -l libcryptopp.dylib | awk '/LC_ID_DYLIB/{f=1} f&&/compatibility version/{print $3; exit}')
        CURRENT=$(otool -l libcryptopp.dylib | awk '/LC_ID_DYLIB/{f=1} f&&/current version/{print $3; exit}')
        echo "compatibility_version=$COMPAT  current_version=$CURRENT  ABI=$ABI"
        case "$COMPAT" in
          "$ABI"|"$ABI.0"|"$ABI.0.0") echo "compatibility_version matches ABI" ;;
          *) echo "ERROR: compatibility_version $COMPAT != ABI $ABI"; exit 1 ;;
        esac

  # =============================================================================
  # Makefile Builds (Backward Compatibility)
  # =============================================================================

  makefile-linux-gcc:
    name: Makefile Linux GCC ${{ matrix.gcc-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc-version: [11, 12, 13]
        cxx-standard: [14, 17, 20]

    steps:
    - uses: actions/checkout@v5

    - name: Install GCC ${{ matrix.gcc-version }}
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
        sudo apt-get update
        sudo apt-get install -y gcc-${{ matrix.gcc-version }} g++-${{ matrix.gcc-version }}

    - name: Build library (C++${{ matrix.cxx-standard }})
      run: |
        export CXX=g++-${{ matrix.gcc-version }}
        export CXXFLAGS="-DNDEBUG -g2 -O3 -std=c++${{ matrix.cxx-standard }}"
        make clean
        make -j"$(nproc)"

    - name: Run validation tests
      run: ./cryptest.exe v

    - name: Run test vectors
      run: ./cryptest.exe tv all

